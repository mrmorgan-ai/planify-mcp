name: test-deploy

# On every push to main: checks, migrations, then deploy to test.
# Off until the repository variable DEPLOY_ENABLED is 'true'.
on:
  push:
    branches: [main]

concurrency:
  group: test-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: testing
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply DB --env test --remote

      - name: Publish
        run: npx wrangler deploy --env test
