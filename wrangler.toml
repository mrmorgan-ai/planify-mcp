name = "planify-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Served only on the custom domains set on the Worker, which Access protects,
# never on a workers.dev address.
workers_dev = false

# Settings and secrets are set with `wrangler secret put` (add `--env test` for
# the test Worker), never here, so a deploy never overwrites them and nothing
# about the account is in the repo:
#   PLANIFY_URL            where planify is served, e.g. https://planify.example.com
#   PLANIFY_CLIENT_ID      the Access service token this Worker calls planify with
#   PLANIFY_CLIENT_SECRET
#   ACCESS_TEAM_DOMAIN     the Access team this Worker is protected by, e.g. team.cloudflareaccess.com
#   ACCESS_AUD             the audience tag of this Worker's own Access application

# Counts the day's tool calls, and nothing else: the roadmap lives in planify.
# Replace database_id with what `wrangler d1 create planify-mcp` prints. Local
# development works with the placeholder: `--local` keys its file off the binding.
[[d1_databases]]
binding = "DB"
database_name = "planify-mcp"
database_id = "1b331a86-c2c5-4234-abb1-af78d8b21688"
migrations_dir = "migrations"

# The test Worker: test-deploy.yml publishes every push to main here, with its
# own count of the day's calls and its own settings, pointed at planify's test
# deployment. prod-deploy.yml then takes the same commit to the Worker above.
# Replace database_id with what `wrangler d1 create planify-mcp-test` prints.
[env.test]
name = "planify-mcp-test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "planify-mcp-test"
database_id = "42be60a0-0d4d-40c8-a1e4-eeff7bfce235"
migrations_dir = "migrations"
